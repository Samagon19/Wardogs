name: WARDOGS Watcher

on:
  schedule:
    # Alle 5 Minuten. GitHub kann Cron-Läufe bei Last verzögern (real oft 5-20 Min).
    - cron: "*/5 * * * *"
  workflow_dispatch: # erlaubt manuelles Auslösen über den Actions-Tab

permissions:
  contents: write # nötig, damit state.json zurück ins Repo committet werden kann

concurrency:
  group: wardogs-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Auf neue Posts prüfen
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          X_HANDLE: WARDOGS
          # Ohne das puffert Python die Ausgabe bis zum Jobende - im Log traegt
          # dann jede Zeile dieselbe Uhrzeit und man sieht 12 Minuten lang nichts.
          PYTHONUNBUFFERED: "1"
          # Tempo vor Inhalt: der Zaehler loest sofort aus, Text und Bild
          # entfallen. Alle 15 Sekunden pruefen, und zwar 50 Mal - ein Job
          # deckt damit rund 12 Minuten ab. Weil GitHub pro concurrency-Gruppe
          # einen Lauf wartend haelt, loest der naechste ab, sobald dieser
          # endet: durchgehende Ueberwachung statt Luecken zwischen Cron-Laeufen.
          NOTIFY_MODE: fast
          CHECK_LOOPS: "50"
          CHECK_PAUSE: "15"
        run: python watcher.py

      - name: Stand sichern
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%FT%TZ)"
            git pull --rebase --autostash || true
            git push
          else
            echo "Keine Änderung am Stand."
          fi
